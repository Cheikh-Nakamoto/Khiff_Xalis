[package]
name = "brvm-engine"
version = "1.0.0"
edition = "2021"
authors = ["BRVM Trading Engine Team"]
description = "Core calculation engine for BRVM trading signals"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }

# gRPC (communication avec Go API)
tonic = "0.11"
prost = "0.12"

# Parallel processing
rayon = "1.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
# Tests
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "technical_analysis"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
